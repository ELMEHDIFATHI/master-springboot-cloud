name: CI/CD Spring Boot

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [accounts, cards, loans]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build and Test
        run: mvn -f ${{ matrix.service }}/pom.xml clean install



      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@v5.0.0
        with:
            args: >
              -Dsonar.projectKey= master-springboot-cloud
              -Dsonar.organization= EL MEHDI FATHI
              -Dsonar.host.url=https://sonarcloud.io
        env:
         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
