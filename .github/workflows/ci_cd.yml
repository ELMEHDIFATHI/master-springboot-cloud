name: CI/CD Spring Boot

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [accounts, cards, loans]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Build and Test
        run: mvn -f ${{ matrix.service }}/pom.xml clean install

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectKey: master-springboot-cloud
          organization: EL MEHDI FATHI
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
